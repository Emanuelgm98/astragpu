name: .NET
on:
  push:
    branches: [main, "feature/**"]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - run: dotnet restore AstraGPU.sln
      - run: dotnet test tests/AstraGPU.Tests/AstraGPU.Tests.csproj --configuration Release --no-restore
      - run: dotnet build src/AstraGPU.App/AstraGPU.App.csproj --configuration Release --no-restore
